<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Card Unlocked! | The Dutch Deck</title>
    
    <meta property="og:title" content="A New Card Appears!">
    <meta property="og:description" content="I just found a rare strain card in the Dutch Deck! Can you collect them all?">
    <meta property="og:image" content="https://dutchtouchgenetics.com/assets/img/dutch-deck-share.jpg">
    <meta property="og:url" content="https://dutchtouchgenetics.com/deck.html">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d6a441; --bg: #050505; --mint: #2ef8bb; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; text-align: center; padding: 20px; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .unlock-container { width: 100%; max-width: 400px; padding: 30px; border-radius: 24px; background: #111; border: 1px solid var(--gold); box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative; }
        
        .status-badge { color: var(--mint); font-size: 14px; font-weight: 800; margin-bottom: 15px; display: block; letter-spacing: 2px; text-transform: uppercase; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.8; text-shadow: 0 0 5px rgba(46, 248, 187, 0.5); } 50% { opacity: 1; text-shadow: 0 0 15px rgba(46, 248, 187, 0.8); } 100% { opacity: 0.8; text-shadow: 0 0 5px rgba(46, 248, 187, 0.5); } }
        
        .strain-name { font-size: 32px; font-family: 'Cinzel', serif; margin: 0 0 20px 0; color: #fff; }
        .card-img { width: 100%; border-radius: 12px; border: 1px solid rgba(214, 164, 65, 0.5); margin-bottom: 15px; -webkit-touch-callout: default; }
        
        .save-tip { background: var(--gold); color: black; font-size: 11px; font-weight: 800; padding: 6px; border-radius: 4px; margin-top: -10px; margin-bottom: 15px; display: none; }
        
        .btn-stack { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { background: var(--gold); color: #000; border: none; padding: 14px; border-radius: 8px; font-weight: 800; width: 100%; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; text-decoration: none; box-sizing: border-box; display: inline-block; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; grid-column: span 2; margin-top: 10px; }
        .btn-mint { background: var(--mint); color: #000; }
    </style>
</head>
<body>

    <div class="unlock-container" id="success-state">
        <span id="status-msg" class="status-badge">✨ NEW CARD UNLOCKED!</span>
        <h1 class="strain-name" id="name-label">Loading...</h1>
        
        <img id="card-art" src="" class="card-img">
        <div id="save-instruction" class="save-tip">👆 LONG-PRESS IMAGE TO SAVE TO PHOTOS</div>
        
        <div class="btn-stack">
            <button onclick="showSaveTip()" class="btn btn-mint" id="save-btn">Save Image</button>
            <button onclick="shareCard()" class="btn">Share Link</button>
            <a href="deck.html" class="btn btn-outline">Open My Deck</a>
        </div>
    </div>

    <script src="js/deck-db.js?v=2.4"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const scannedId = urlParams.get('id');
        const card = GL_CARDS.find(c => c.id === scannedId);

        if (card) {
            document.getElementById('name-label').innerText = card.name;
            document.getElementById('card-art').src = card.image;
            
            let collected = JSON.parse(localStorage.getItem('dutchDeck')) || [];
            
            if (!collected.includes(scannedId)) {
                collected.push(scannedId);
                localStorage.setItem('dutchDeck', JSON.stringify(collected));
            } else {
                document.getElementById('status-msg').innerText = "🔄 DUPLICATE FOUND!";
                document.getElementById('status-msg').style.color = "#aaa";
                document.getElementById('status-msg').style.animation = "none";
            }
        } else {
            document.getElementById('name-label').innerText = "Card Not Found";
            document.getElementById('status-msg').innerText = "⚠️ ERROR";
            document.getElementById('status-msg').style.color = "#ff4444";
        }

        function showSaveTip() {
            document.getElementById('save-instruction').style.display = 'block';
            document.getElementById('save-btn').innerText = "Tap & Hold Image";
        }

        function shareCard() {
            if (navigator.share) {
                navigator.share({
                    title: 'The Dutch Deck!',
                    text: `Check out the ${card ? card.name : 'premium card'} I found in the Dutch Deck!`,
                    url: window.location.href
                });
            } else {
                alert("Long press the image to save it and share to your story!");
            }
        }
    </script>
</body>
</html>
