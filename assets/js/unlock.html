<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlocking Card... | The Dutch Deck</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { 
      background: #050505; 
      color: #D6A34A; 
      font-family: 'Cinzel', serif; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      margin: 0; 
      text-align: center; 
      flex-direction: column; 
    }
    .spinner { 
      border: 4px solid rgba(214, 164, 65, 0.2); 
      border-top: 4px solid #D6A34A; 
      border-radius: 50%; 
      width: 60px; 
      height: 60px; 
      animation: spin 1s linear infinite; 
      margin-bottom: 25px; 
      box-shadow: 0 0 20px rgba(214, 164, 65, 0.4);
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h1 { margin: 0 0 10px 0; font-size: 28px; letter-spacing: 2px; }
    p { font-family: 'Inter', sans-serif; color: #fff; font-size: 14px; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>UNLOCKING...</h1>
  <p>Securing genetics in your Dutch Deck.</p>

  <script>
    // 1. Grab the exact strain ID from the QR code link
    const urlParams = new URLSearchParams(window.location.search);
    const newCardId = urlParams.get('id');

    if (newCardId) {
      // 2. Open up their new "Dutch Deck" storage (Notice it uses the NEW storage key!)
      let deck = JSON.parse(localStorage.getItem('dutchDeck')) || [];

      // 3. If they don't already have the card, add it to their deck
      if (!deck.includes(newCardId)) {
        deck.push(newCardId);
        localStorage.setItem('dutchDeck', JSON.stringify(deck));
      }

      // 4. Give the suspense spinner 1.5 seconds, then drop them into their collection
      setTimeout(() => {
        window.location.href = 'deck.html';
      }, 1500); 
    } else {
      // If someone just types the URL by accident, send them to the deck anyway
      window.location.href = 'deck.html';
    }
  </script>
</body>
</html>
