<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dutch Deck | Premium Strain Collection</title>
    
    <meta property="og:title" content="The Dutch Deck">
    <meta property="og:description" content="Check out the premium Dutch Cards I've collected! How many do you have?">
    <meta property="og:image" content="https://dutchtouchgenetics.com/assets/img/dutch-deck-share.jpg">
    <meta property="og:url" content="https://dutchtouchgenetics.com/deck.html">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d6a441; --bg: #050505; --mint: #2ef8bb; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        h1 { font-family: 'Cinzel', serif; color: var(--gold); text-align: center; font-size: 36px; margin-bottom: 5px; text-shadow: 0 4px 15px rgba(214, 164, 65, 0.2); }
        .subtitle { text-align: center; color: #aaa; font-size: 14px; margin-bottom: 30px; font-weight: 700; letter-spacing: 1px; }
        
        /* Collection View Controls */
        .carousel-title { font-family: 'Cinzel', serif; font-size: 18px; color: #fff; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; text-align: center; }
        .view-controls { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .view-btn { background: transparent; border: 1px solid rgba(214, 164, 65, 0.5); color: var(--gold); padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; }
        .view-btn.active { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 0 10px rgba(214, 164, 65, 0.4); }

        /* Dynamic Collection Wrapper */
        .my-collection-wrapper { margin-bottom: 40px; min-height: 180px; width: 100%; transition: 0.3s; }
        .empty-carousel { font-size: 13px; color: #666; font-style: italic; text-align: center; padding: 40px 0; }

        /* Carousel, Grid, and Fan Views */
        .view-carousel { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 20px; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .view-carousel::-webkit-scrollbar { display: none; }
        .view-carousel .card { flex: 0 0 120px; scroll-snap-align: start; cursor: pointer; }
        .view-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; }
        .view-fan { display: flex; justify-content: center; align-items: center; padding: 40px 0; min-height: 250px; }
        .view-fan .card { width: 100px; margin-left: -60px; cursor: pointer; transition: 0.3s ease; transform-origin: bottom center; box-shadow: -5px 0 15px rgba(0,0,0,0.8); }
        .view-fan .card:first-child { margin-left: 0; }
        .view-fan .card:hover { transform: translateY(-40px) scale(1.15) rotate(0deg) !important; z-index: 1000 !important; margin: 0 10px; }

        /* Master Binder Set Styles */
        .set-container { margin-bottom: 50px; background: rgba(255,255,255,0.02); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .set-header { text-align: center; margin-bottom: 20px; }
        .set-title { font-family: 'Cinzel', serif; font-size: 26px; color: var(--gold); text-transform: uppercase; margin: 0; letter-spacing: 2px; }
        .set-tagline { font-size: 13px; color: #888; margin-top: 5px; font-weight: 600; }
        
        .set-reward-banner { background: rgba(46, 248, 187, 0.1); color: var(--mint); padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 800; margin-bottom: 20px; text-align: center; border: 1px solid rgba(46, 248, 187, 0.3); text-transform: uppercase; letter-spacing: 1px; cursor: pointer; animation: glow 2s infinite alternate; }
        @keyframes glow { from { box-shadow: 0 0 5px rgba(46, 248, 187, 0.2); } to { box-shadow: 0 0 15px rgba(46, 248, 187, 0.5); } }
        
        /* 6-Card Grid Optimization */
        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        @media (min-width: 600px) { .card-grid { grid-template-columns: repeat(6, 1fr); gap: 15px; } }
        
        .card { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.2s; cursor: pointer; background: #111; }
        .card.locked { filter: grayscale(1) brightness(0.3); }
        .card img { width: 100%; display: block; object-fit: contain; }

        /* Modals & Buttons */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal-content { background: #111; padding: 20px; border-radius: 20px; text-align: center; border: 1px solid var(--gold); max-width: 350px; width: 100%; position: relative; }
        .modal-img { width: 100%; border-radius: 12px; margin-bottom: 15px; }
        .modal-qr { position: absolute; inset: 0; background: white; border-radius: 12px; display: none; align-items: center; justify-content: center; padding: 20px; margin-bottom: 15px; }
        .modal-qr img { width: 100%; max-width: 200px; }
        .save-tip { background: var(--gold); color: black; font-size: 11px; font-weight: 800; padding: 6px; border-radius: 4px; margin-bottom: 15px; display: none; }
        .modal-name { font-family: 'Cinzel', serif; font-size: 24px; color: #fff; margin: 0 0 5px 0; }
        .modal-reward { font-size: 13px; color: var(--mint); font-weight: 800; margin-bottom: 20px; }
        .btn { background: var(--gold); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 800; width: 100%; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; text-decoration: none; display: inline-block; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; margin-top: 10px; }
        .btn-redeem { background: var(--mint); margin-bottom: 10px; }
        
        /* Fullscreen Swiper */
        .fs-modal { position: fixed; inset: 0; background: #000; z-index: 200; display: none; flex-direction: column; }
        .fs-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; z-index: 210; font-size: 20px; cursor: pointer; }
        .fs-gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; height: 100%; align-items: center; scrollbar-width: none; }
        .fs-item { flex: 0 0 100%; scroll-snap-align: center; display: flex; justify-content: center; padding: 20px; box-sizing: border-box; }
        .fs-item img { max-width: 100%; max-height: 80vh; object-fit: contain; }
    </style>
</head>
<body>

    <h1>THE DUTCH DECK</h1>
    <p class="subtitle" id="collection-counter">0 / 0 CARDS FOUND</p>

    <div class="carousel-title">MY COLLECTED CARDS</div>
    <div class="view-controls">
        <button class="view-btn active" onclick="setView('carousel', this)">Carousel</button>
        <button class="view-btn" onclick="setView('grid', this)">Grid</button>
        <button class="view-btn" onclick="setView('fan', this)">Fanned Deck</button>
    </div>
    
    <div id="my-collection-wrapper" class="my-collection-wrapper"></div>

    <div class="carousel-title" style="margin-top: 40px;">THE MASTER BINDER</div>
    <div id="binder"></div>

    <div class="modal" id="card-modal">
        <div class="modal-content">
            <div style="position: relative;" onclick="openFullscreen()">
                <img id="modal-img" src="" class="modal-img">
                <div id="modal-qr" class="modal-qr"><img id="qr-img" src=""></div>
            </div>
            <div id="save-instruction" class="save-tip">👆 LONG-PRESS IMAGE TO SAVE</div>
            <h2 id="modal-name" class="modal-name">Strain Name</h2>
            <p id="modal-reward" class="modal-reward">Reward Data</p>
            <button class="btn btn-redeem" id="toggle-qr-btn" onclick="toggleQR()">📱 Redeem (Budtender Scan)</button>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn" id="modal-share-btn">Share Link</button>
                <button class="btn btn-outline" id="save-btn" onclick="showSaveTip()">Save Image</button>
            </div>
            <button class="btn btn-outline" style="border:none; color:#888; width:100%;" onclick="closeModal()">Close</button>
        </div>
    </div>

    <div class="fs-modal" id="fs-modal">
        <button class="fs-close" onclick="closeFullscreen()">✕</button>
        <div class="fs-gallery" id="fs-gallery"></div>
    </div>

    <script src="js/deck-db.js?v=2.4"></script>
    <script>
        const collected = JSON.parse(localStorage.getItem('dutchDeck')) || [];
        const binder = document.getElementById('binder');
        let currentCardId = null;
        let qrShowing = false;
        let currentView = 'carousel';

        function init() {
            document.getElementById('collection-counter').innerText = `${collected.length} / ${GL_CARDS.length} CARDS FOUND`;
            renderMyCollection();
            renderMasterBinder();
        }

        function renderMyCollection() {
            const wrapper = document.getElementById('my-collection-wrapper');
            wrapper.innerHTML = '';
            wrapper.className = `my-collection-wrapper view-${currentView}`;

            if (collected.length === 0) {
                wrapper.innerHTML = `<div class="empty-carousel">Scan a QR code in-store to start your collection!</div>`;
                return;
            }

            const middleIndex = (collected.length - 1) / 2;
            collected.forEach((id, index) => {
                const card = GL_CARDS.find(c => c.id === id);
                if (!card) return;
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = `<img src="${card.image}">`;
                cardEl.onclick = () => openCardModal(card, true);

                if (currentView === 'fan') {
                    const offset = index - middleIndex;
                    cardEl.style.transform = `rotate(${offset * 5}deg) translateY(${Math.abs(offset) * 4}px)`;
                    cardEl.style.zIndex = index;
                }
                wrapper.appendChild(cardEl);
            });
        }

        function renderMasterBinder() {
            binder.innerHTML = '';
            GL_SETS.forEach(set => {
                const isComplete = set.cardIds.every(id => collected.includes(id));
                const setDiv = document.createElement('div');
                setDiv.className = 'set-container';
                setDiv.innerHTML = `
                    <div class="set-header">
                        <h2 class="set-title">${set.name}</h2>
                        <div class="set-tagline">${set.tagline}</div>
                    </div>
                    ${isComplete ? `<div class="set-reward-banner">🏆 CLAIM: ${set.reward}</div>` : ''}
                    <div class="card-grid" id="grid-${set.id}"></div>
                `;
                binder.appendChild(setDiv);

                const grid = document.getElementById(`grid-${set.id}`);
                set.cardIds.forEach(cardId => {
                    const cardData = GL_CARDS.find(c => c.id === cardId);
                    if (!cardData) return;
                    const isCollected = collected.includes(cardId);
                    const cardEl = document.createElement('div');
                    cardEl.className = `card ${isCollected ? '' : 'locked'}`;
                    cardEl.innerHTML = `<img src="${cardData.image}">`;
                    cardEl.onclick = () => openCardModal(cardData, isCollected);
                    grid.appendChild(cardEl);
                });
            });
        }

        function setView(view, btn) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMyCollection();
        }

        function openCardModal(card, unlocked) {
            currentCardId = card.id;
            qrShowing = false;
            const modal = document.getElementById('card-modal');
            const img = document.getElementById('modal-img');
            
            img.src = card.image;
            img.style.filter = unlocked ? "none" : "grayscale(1) brightness(0.3)";
            document.getElementById('modal-name').innerText = unlocked ? card.name : "???";
            document.getElementById('modal-reward').innerText = unlocked ? `Perk: ${card.reward}` : "Keep searching!";
            
            document.getElementById('toggle-qr-btn').style.display = unlocked ? "block" : "none";
            document.getElementById('modal-qr').style.display = "none";
            img.style.display = "block";
            
            document.getElementById('modal-share-btn').onclick = () => {
                const shareUrl = `https://dutchtouchgenetics.com/unlock.html?id=${card.id}`;
                if (navigator.share) {
                    navigator.share({ title: 'The Dutch Deck', text: `I found ${card.name}!`, url: shareUrl });
                } else {
                    alert("Share link copied!");
                    navigator.clipboard.writeText(shareUrl);
                }
            };

            modal.style.display = 'flex';
        }

        function toggleQR() {
            qrShowing = !qrShowing;
            const card = GL_CARDS.find(c => c.id === currentCardId);
            document.getElementById('modal-img').style.display = qrShowing ? "none" : "block";
            document.getElementById('modal-qr').style.display = qrShowing ? "flex" : "none";
            if (qrShowing) document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(card.reward)}`;
        }

        function showSaveTip() { document.getElementById('save-instruction').style.display = 'block'; }
        function closeModal() { document.getElementById('card-modal').style.display = 'none'; }
        function openFullscreen() {
            if (!collected.includes(currentCardId)) return;
            const gallery = document.getElementById('fs-gallery');
            gallery.innerHTML = collected.map(id => {
                const c = GL_CARDS.find(card => card.id === id);
                return `<div class="fs-item"><img src="${c.image}"></div>`;
            }).join('');
            document.getElementById('fs-modal').style.display = 'flex';
        }
        function closeFullscreen() { document.getElementById('fs-modal').style.display = 'none'; }

        window.onload = init;
    </script>
</body>
</html>
